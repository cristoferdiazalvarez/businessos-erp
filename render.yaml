# Applying this Blueprint creates paid resources. Owner approval is required.
services:
  - type: pserv
    name: businessos-api
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    repo: https://github.com/cristoferdiazalvarez/businessos-erp
    branch: main
    autoDeployTrigger: "off"
    numInstances: 1
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm --filter @businessos/api build
    preDeployCommand: corepack pnpm db:migrate
    startCommand: corepack pnpm --filter @businessos/api start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: WEB_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: businessos-db
          property: connectionString
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_MANAGER_PASSWORD
        generateValue: true
      - key: DEMO_EMPLOYEE_PASSWORD
        generateValue: true
  - type: web
    name: businessos-web
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    repo: https://github.com/cristoferdiazalvarez/businessos-erp
    branch: main
    autoDeployTrigger: "off"
    numInstances: 1
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm --filter @businessos/web build
    startCommand: corepack pnpm --filter @businessos/web start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: API_INTERNAL_HOST
        fromService:
          name: businessos-api
          type: pserv
          property: host
      - key: API_INTERNAL_PORT
        fromService:
          name: businessos-api
          type: pserv
          property: port
databases:
  - name: businessos-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: businessos
    user: businessos
    ipAllowList: []
